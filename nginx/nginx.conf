server {
    listen 80;

    # Serve the frontend dashboard
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to each backend service.
    # This puts everything on the same origin so the browser has no CORS issues.
    location /api/books {
        proxy_pass         http://book-service:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Correlation-ID $http_x_correlation_id;
    }

    location /api/inventory {
        proxy_pass         http://inventory-service:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }

    location /api/notifications {
        proxy_pass         http://notification-service:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
    }
}
